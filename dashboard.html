<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviTec - Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-brand">
                <img src="logo.png" alt="Logo">
                <h2>MoviTec</h2>
            </div>
            <a href="index.html" class="back-link">🏠 Home</a>
        </header>
        <main class="dashboard-panel">
            <div class="map-placeholder">
                <p>🗺️ Active Routes Map</p>
            </div>

            <div class="trip-selection" style="background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px;">
                <h3>Find a Ride</h3>
                <div class="input-group" style="margin-top: 10px;">
                    <label>Origin</label>
                    <select>
                        <option value="">Where are you leaving from?</option>
                        <option value="campus">🏫 Tec Campus</option>
                        <option disabled>────── Boroughs ──────</option>
                        <option value="alvaro_obregon">Álvaro Obregón</option>
                        <option value="azcapotzalco">Azcapotzalco</option>
                        <option value="benito_juarez">Benito Juárez</option>
                        <option value="coyoacan">Coyoacán</option>
                        <option value="cuajimalpa">Cuajimalpa</option>
                        <option value="cuauhtemoc">Cuauhtémoc</option>
                        <option value="gam">Gustavo A. Madero</option>
                        <option value="iztacalco">Iztacalco</option>
                        <option value="iztapalapa">Iztapalapa</option>
                        <option value="magdalena_contreras">Magdalena Contreras</option>
                        <option value="miguel_hidalgo">Miguel Hidalgo</option>
                        <option value="milpa_alta">Milpa Alta</option>
                        <option value="tlahuac">Tláhuac</option>
                        <option value="tlalpan">Tlalpan</option>
                        <option value="venustiano_carranza">Venustiano Carranza</option>
                        <option value="xochimilco">Xochimilco</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Destination</label>
                    <select>
                        <option value="">Where are you going?</option>
                        <option value="campus">🏫 Tec Campus</option>
                        <option disabled>────── Boroughs ──────</option>
                        <option value="alvaro_obregon">Álvaro Obregón</option>
                        <option value="azcapotzalco">Azcapotzalco</option>
                        <option value="benito_juarez">Benito Juárez</option>
                        <option value="coyoacan">Coyoacán</option>
                        <option value="cuajimalpa">Cuajimalpa</option>
                        <option value="cuauhtemoc">Cuauhtémoc</option>
                        <option value="gam">Gustavo A. Madero</option>
                        <option value="iztacalco">Iztacalco</option>
                        <option value="iztapalapa">Iztapalapa</option>
                        <option value="magdalena_contreras">Magdalena Contreras</option>
                        <option value="miguel_hidalgo">Miguel Hidalgo</option>
                        <option value="milpa_alta">Milpa Alta</option>
                        <option value="tlahuac">Tláhuac</option>
                        <option value="tlalpan">Tlalpan</option>
                        <option value="venustiano_carranza">Venustiano Carranza</option>
                        <option value="xochimilco">Xochimilco</option>
                    </select>
                </div>
                <button class="btn-primary">Search Drivers</button>
            </div>

            <div class="saved-routes">
                <h3>Frequent Routes (Click to select)</h3>
                <div class="route-tags">
                    <button type="button" class="tag" onclick="this.classList.toggle('active')">🏠 Home to Campus</button>
                    <button type="button" class="tag" onclick="this.classList.toggle('active')">🏫 Campus to Home</button>
                </div>
            </div>
        </main>
        
        <nav class="bottom-nav">
            <a href="dashboard.html">Passenger</a>
            <a href="conductor.html">Driver</a>
            <a href="billetera.html">Wallet</a>
        </nav>
    </div>
</body>
</html>
