<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviTec - Active Trip</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-brand">
                <img src="logo.png" alt="Logo">
                <h2>MoviTec</h2>
            </div>
            <a href="index_en.html" class="back-link">🏠 Home</a>
        </header>
        <main class="active-trip">
            <div class="active-trip-header" style="margin-bottom: 15px;">
                <h2>Trip in Progress</h2>
                <button class="btn-sos" onclick="alert('🚨 Alert sent. Stay calm, help is on the way.')">🚨 SOS</button>
            </div>
            
            <div class="chat-box">
                <div class="message received">
                    <p><strong>Ana P.:</strong> Hi! I'm already at the meeting point, hazard lights are on.</p>
                </div>
                <div class="message sent">
                    <p><strong>You:</strong> Perfect, I'll be there in 2 minutes!</p>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" placeholder="Type a safe message...">
                <button class="btn-primary" style="width: auto;">Send</button>
            </div>
            
            <div class="rating-modal">
                <h3>Simulate End of Trip</h3>
                <p>Rate your experience to maintain community quality.</p>
                <h2 style="color: gold; text-align: center; margin: 10px 0;">⭐ ⭐ ⭐ ⭐ ⭐</h2>
                <button class="btn-primary" onclick="window.location.href='dashboard_en.html'">Submit 5-star Review</button>
            </div>
        </main>
    </div>
</body>
</html>
