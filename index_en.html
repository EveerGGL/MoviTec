<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviTec - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-brand">
                <img src="logo.png" alt="MoviTec Logo">
                <h1>MoviTec</h1>
            </div>
        </header>

        <main class="auth-form">
            <h2>Create your account</h2>
            
            <div class="input-group" style="margin-top: 1.5rem;">
                <label for="email">Institutional Email</label>
                <input type="email" id="email" placeholder="your.name@tec.mx" required>
            </div>

            <button class="btn-primary" onclick="window.location.href='dashboard_en.html'">
                Start
            </button>
        </main>
    </div>
</body>
</html>
