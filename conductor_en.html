<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviTec - Driver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-brand">
                <img src="logo.png" alt="Logo">
                <h2>MoviTec</h2>
            </div>
            <a href="index_en.html" class="back-link">🏠 Home</a>
        </header>
        <main class="conductor-panel">
            <section class="publish-trip">
                <h3>Publish Trip</h3>
                
                <div class="input-group">
                    <label>Origin Borough</label>
                    <select>
                        <option value="">Select Borough...</option>
                        <option value="alvaro_obregon">Álvaro Obregón</option>
                        <option value="azcapotzalco">Azcapotzalco</option>
                        <option value="benito_juarez">Benito Juárez</option>
                        <option value="coyoacan">Coyoacán</option>
                        <option value="cuajimalpa">Cuajimalpa</option>
                        <option value="cuauhtemoc">Cuauhtémoc</option>
                        <option value="gam">Gustavo A. Madero</option>
                        <option value="iztacalco">Iztacalco</option>
                        <option value="iztapalapa">Iztapalapa</option>
                        <option value="magdalena_contreras">Magdalena Contreras</option>
                        <option value="miguel_hidalgo">Miguel Hidalgo</option>
                        <option value="milpa_alta">Milpa Alta</option>
                        <option value="tlahuac">Tláhuac</option>
                        <option value="tlalpan">Tlalpan</option>
                        <option value="venustiano_carranza">Venustiano Carranza</option>
                        <option value="xochimilco">Xochimilco</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Departure Time</label>
                    <div class="time-selector">
                        <select id="hora">
                            <option>1</option><option>2</option><option>3</option><option>4</option>
                            <option>5</option><option>6</option><option>7</option><option>8</option>
                            <option>9</option><option>10</option><option>11</option><option>12</option>
                        </select>
                        <select id="minutos">
                            <option>00</option>
                            <option>15</option>
                            <option>30</option>
                            <option>45</option>
                        </select>
                        <select id="ampm">
                            <option>AM</option>
                            <option>PM</option>
                        </select>
                    </div>
                </div>

                <div class="preferences" style="margin-top: 20px;">
                    <label>Trip Preferences (Click to select):</label>
                    <div class="route-tags">
                        <button type="button" class="tag" onclick="this.classList.toggle('active')">🎵 Music allowed</button>
                        <button type="button" class="tag" onclick="this.classList.toggle('active')">🤫 I prefer silence</button>
                    </div>
                </div>

                <button class="btn-primary" onclick="window.location.href='viaje_activo_en.html'" style="margin-top: 20px;">
                    I'm ready to drive
                </button>
            </section>
        </main>
        
        <nav class="bottom-nav">
            <a href="dashboard_en.html">Passenger</a>
            <a href="conductor_en.html">Driver</a>
            <a href="billetera_en.html">Wallet</a>
        </nav>
    </div>
</body>
</html>
